<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 660" role="img" aria-labelledby="t"><title id="t">Leegtech brings patents, designs, trademarks, copyright, business and tax, and agreements together under one roof</title>
<style>
text{font-family:Nunito,Arial,sans-serif}
.orbit{transform-origin:260px 330px;animation:spin 40s linear infinite}
.orbit2{transform-origin:260px 330px;animation:spin 60s linear infinite reverse}
.spoke{stroke:#E86A1E;stroke-width:2;stroke-dasharray:6 8;opacity:.35;animation:flow 6s linear infinite}
.node circle:nth-child(2){transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite;animation-delay:inherit}
.core{transform-origin:260px 330px;animation:breathe 4s ease-in-out infinite}
.halo{transform-origin:260px 330px;animation:halo 4s ease-out infinite}
.dot{animation:spin 12s linear infinite;transform-origin:260px 330px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes halo{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
