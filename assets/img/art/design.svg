<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t"><title id="t">Product design drawing with dimensions, colour swatches and a pen tool</title>
<style>
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 7s ease-in-out infinite}
.fill{animation:fill 7s ease-in-out infinite}
.sw{animation:float 4.5s ease-in-out infinite}.sw2{animation-delay:-1.5s}.sw3{animation-delay:-3s}
.pen{animation:pen 7s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:900}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes fill{0%,40%{fill-opacity:0}55%,90%{fill-opacity:1}100%{fill-opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pen{0%{transform:translate(0,0)}20%{transform:translate(-60px,70px)}40%{transform:translate(-10px,140px)}60%,100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.fill{fill-opacity:1}}
</style>
