<g class="gear2"><path d="M503 138h6l2 8 7 3 7-5 4 4-5 7 3 7 8 2v6l-8 2-3 7 5 7-4 4-7-5-7 3-2 8h-6l-2-8-7-3-7 5-4-4 5-7-3-7-8-2v-6l8-2 3-7-5-7 4-4 7 5 7-3z" fill="#E86A1E"/><circle cx="506" cy="160" r="8" fill="#fff"/></g>
<g class="float" style="animation-delay:-2s"><rect x="330" y="228" width="200" height="150" rx="12" fill="#fff" stroke="#e8e5e0" stroke-width="2"/><rect x="330" y="228" width="200" height="34" rx="12" fill="#121212"/><rect x="330" y="248" width="200" height="14" fill="#121212"/>
